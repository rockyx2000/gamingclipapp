# ローカルで一式（web / api / PostgreSQL）を動かす。
#   docker compose up --build
# web: http://localhost:3000   api: http://localhost:4000/api/healthz
# 開発用の設定なので、パスワードなどは本番では使わないこと。

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gameclips
      POSTGRES_PASSWORD: gameclips
      POSTGRES_DB: gameclips
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameclips -d gameclips"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://gameclips:gameclips@db:5432/gameclips
      # ユーザー名だけでログインできるデモログイン（パスワード検証なし）。本番では付けない
      DEMO_LOGIN: "true"
    depends_on:
      db:
        condition: service_healthy
    # 起動のたびにマイグレーションとシード（何度流しても重複しない）を済ませてから待ち受ける
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js && node dist/index.js"]
    volumes:
      # アップロードした動画・サムネイル
      - api-data:/data
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # ゲームの読み取りを api から行う（未設定ならモックストア）
      API_URL: http://api:4000
    depends_on:
      - api
    volumes:
      # API_URL を外してモックで動かすときだけ使う
      - web-data:/data
    ports:
      - "3000:3000"

volumes:
  db-data:
  api-data:
  web-data:
